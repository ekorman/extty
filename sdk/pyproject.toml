[project]
name = "extty"
dynamic = ["version"]
description = "Terminal-native ML experiment tracker"
requires-python = ">=3.10"
dependencies = ["psutil>=5.9.0", "boto3>=1.34.0", "nvidia-ml-py>=12.0.0"]


[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["extty*"]

[tool.setuptools_scm]
root = ".."

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
modal = ["modal>=1.3.0.post1"]
run-analysis = ["pandas>=2.0.0", "matplotlib>=3.7.0"]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-cov>=4.0.0", "pre-commit>=4.5.1"]
