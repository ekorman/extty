[package]
name = "extty"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
clap = { version = "4.5", features = ["derive"] }
russh = "0.45"
russh-keys = "0.45"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "macros"] }
once_cell = "1.21"
rpassword = "7.3"
