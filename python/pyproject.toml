[project]
name = "extty"
dynamic = ["version"]
description = "Terminal-native ML experiment tracker"
requires-python = ">=3.10"
dependencies = ["psutil>=5.9.0"]

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=12.0.0"]
dev = ["pytest>=8.0.0", "pytest-cov>=4.0.0", "pre-commit>=4.5.1"]
infra = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "tomli-w>=1.0.0",
]

[project.scripts]
extty-infra = "extty_infra.cli:app"

[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["extty*"]

[tool.setuptools_scm]
root = ".."

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
modal = [
    "modal>=1.3.0.post1",
]
