[project]
name = "extty"
version = "0.1.0"
description = "Terminal-native ML experiment tracker"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9.0",
]

[project.optional-dependencies]
gpu = [
    "nvidia-ml-py>=12.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["extty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
