[package]
name = "extty"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ekorman/extty"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
toml = "0.8"
aws-config = "1.5"
aws-sdk-s3 = "1.65"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
dialoguer = { version = "0.12", default-features = false }
ratatui-image = { version = "5", default-features = false, features = [
    "crossterm",
] }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.release]
# Skip crates.io publish (set to true when ready to publish)
publish = false
# Tag format
tag-name = "v{{version}}"
# Commit message format
tag-message = "Release {{version}}"
# Push to remote
push = true
