name: Publish Python SDK

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools_scm derives the version from the git tag
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10

      - name: Build sdist and wheel
        run: uv build --package extty --out-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/extty
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
