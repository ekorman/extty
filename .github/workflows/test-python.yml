name: Tests (Python)

on:
  push:
    paths:
      - "sdk/**"
      - "spec/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test-python.yml"

jobs:
  test-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: uv sync --dev
      - run: uv run pytest tests
